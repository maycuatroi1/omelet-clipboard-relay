# Step 3 establishes the topology. Step 8 wires coturn REST auth, step 11 deploys.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: omelet/clipboard-relay:dev
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://clipboard:clipboard@postgres:5432/clipboard
      JWT_SECRET: ${JWT_SECRET:-change-me}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipboard}
      POSTGRES_USER: ${POSTGRES_USER:-clipboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "443:443/tcp"
    environment:
      # MUST match the relay's TURN_STATIC_AUTH_SECRET. Both sides compute the
      # same HMAC-SHA1 over "<expiry>:<random>" usernames (see coturn/turnserver.conf).
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-change-me}
    volumes:
      # Config template; entrypoint substitutes the secret in at startup.
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf.template:ro
      # Operator mounts real TLS certs here at deploy time (step 11):
      #   /etc/coturn/certs/fullchain.pem and /etc/coturn/certs/privkey.pem
      - coturn_certs:/etc/coturn/certs:ro
    entrypoint:
      - /bin/sh
      - "-c"
      # Substitute the placeholder with the env var, then exec turnserver
      # against the rendered config. No CLI tunables - the config file owns them.
      - |
        sed "s|__TURN_STATIC_AUTH_SECRET__|$${TURN_STATIC_AUTH_SECRET}|g" \
          /etc/coturn/turnserver.conf.template > /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf
    restart: unless-stopped

volumes:
  postgres_data:
  coturn_certs:
