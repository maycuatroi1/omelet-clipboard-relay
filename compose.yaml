# Step 3 establishes the topology. Step 8 wires coturn REST auth, step 11 deploys.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: omelet/clipboard-relay:dev
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://clipboard:clipboard@postgres:5432/clipboard
      JWT_SECRET: ${JWT_SECRET:-change-me}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipboard}
      POSTGRES_USER: ${POSTGRES_USER:-clipboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    environment:
      # MUST match the relay's TURN_STATIC_AUTH_SECRET. Both sides compute the
      # same HMAC-SHA1 over "<expiry>:<random>" usernames (see coturn/turnserver.conf).
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-change-me}
    restart: unless-stopped
    command:
      - --use-auth-secret
      - --static-auth-secret=$${TURN_STATIC_AUTH_SECRET}
      - --realm=clip.omelet.tech
      - --listening-ip=0.0.0.0
      - --min-port=49152
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls

volumes:
  postgres_data: {}
