# coturn/turnserver.conf - omelet-clipboard-relay TURN server config.
#
# Contract with the relay (see harness/contracts.yaml `ice-config` and the
# invariant `no-static-turn-creds`):
#   - GET /ice on the relay computes:
#       username   = "<expiry-unix-seconds>:<random-base64url-16>"
#       credential = base64( HMAC-SHA1(username, TURN_STATIC_AUTH_SECRET) )
#       ttl        = 600 seconds
#   - Coturn uses the SAME TURN_STATIC_AUTH_SECRET to verify incoming
#     ALLOCATE requests via the REST API auth mechanism (use-auth-secret).
#   - Both sides MUST share the same secret and compute identical HMACs for
#     the same username+window. Coturn verifies statelessly - no backchannel
#     to the relay, no shared user database.
#
# The static-auth-secret value is substituted from the TURN_STATIC_AUTH_SECRET
# environment variable at container startup - see compose.yaml `coturn.entrypoint`.
# The literal token __TURN_STATIC_AUTH_SECRET__ below is a placeholder marker,
# NEVER a real secret. Keep TURN_STATIC_AUTH_SECRET base64-safe (A-Za-z0-9+/=)
# so the sed substitution delimiter (`|`) in compose cannot be tripped.

# Long-term credential mechanism + REST API (time-limited HMAC) auth.
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_STATIC_AUTH_SECRET__

# Realm and server name. MUST match what the relay advertises.
realm=clip.omelet.tech
server-name=clip.omelet.tech

# Listen on the standard STUN/TURN port (UDP + TCP) and TLS on 443 so the
# `turns:` fallback works on networks that only allow HTTPS egress.
listening-port=3478
tls-listening-port=443
listening-ip=0.0.0.0

# Relay port range (ephemeral). Defaults; tighten at deploy (step 11).
min-port=49152
max-port=65535

# TLS cert paths. Operator mounts real certs at runtime via a Docker volume
# (see compose.yaml `coturn_certs`); certs are NOT baked into the image.
# Expected files: fullchain.pem and privkey.pem.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# This file is the whole config - no CLI tunables. Disable the admin CLI.
no-cli

# Standard hygiene.
fingerprint
no-multicast-peers
log-file=stdout
